name: Install

# The one-command installers (scripts/install.sh, scripts/install.ps1) on clean machines:
# they install the latest published release, and the app they install starts and keeps
# running. Runs when a release is published, and by hand.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 24.04 has no FUSE 2, which an AppImage usually needs.
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install, as a writer would
        run: sh scripts/install.sh < /dev/null
      - name: The command line reads a project
        run: ~/.local/bin/easyscript stats crates/core/tests/fixtures/lighthouse
      - name: The app starts and keeps running
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            app="$(ls ~/Applications/easyscript.app/Contents/MacOS/* | head -n 1)"
            "$app" crates/core/tests/fixtures/lighthouse & pid=$!
          else
            # A desktop has a display and the graphics libraries (EGL, Mesa); a server has
            # neither, and the AppImage leaves the graphics drivers to the system.
            sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1-mesa-dri
            xvfb-run -a ~/.local/bin/easyscript-app crates/core/tests/fixtures/lighthouse & pid=$!
          fi
          sleep 20
          kill -0 "$pid"
          kill "$pid"

  windows:
    name: install.ps1 (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, as a writer would
        shell: powershell
        run: Get-Content scripts\install.ps1 -Raw | Invoke-Expression
      - name: The command line reads a project
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\easyscript-cli\easyscript.exe" stats crates/core/tests/fixtures/lighthouse
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The app starts and keeps running
        shell: pwsh
        run: |
          $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 2 -Filter "easyscript*.exe" | Where-Object { $_.Name -notmatch "uninstall" -and $_.DirectoryName -notmatch "easyscript-cli" } | Select-Object -First 1
          Write-Host "Starting $($exe.FullName)"
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "crates\core\tests\fixtures\lighthouse" -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) { Write-Host "It stopped with code $($process.ExitCode)"; exit 1 }
          Stop-Process -Id $process.Id
