name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # `cargo test` writes the frontend's types from the Rust model; they must be committed.
      - name: TypeScript types match the model
        if: runner.os == 'Linux'
        run: |
          git status --porcelain app/ui/src/lib/bindings
          test -z "$(git status --porcelain app/ui/src/lib/bindings)"

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # macOS and Windows do not tell `Reader.svelte` from `reader.svelte.ts`.
      - name: No two files differ only in case
        run: test -z "$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)"
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build:ui
      - name: Build the single-file page
        run: npm run build:page
