[package]
name = "dm-app"
description = "dialogue-maker desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
dm-core.workspace = true
dm-formats.workspace = true
dm-github.workspace = true
keyring = "4.2.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"

[lints]
workspace = true

[dev-dependencies]
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
tauri = { version = "2.12.4", features = ["test"] }
tempfile = "3.27.0"
