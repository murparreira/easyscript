[package]
name = "es-formats"
description = "easyscript exports (JSON, translation CSV, voice scripts, Fountain, the dialogue files as a ZIP) and imports (Twee, Yarn Spinner, Ink, Dialogue Manager)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
csv = "1.4.0"
es-core.workspace = true
es-syntax.workspace = true
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12.0.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
expect-test = "1.5.1"
tempfile = "3.27.0"
