[package]
name = "dm-core"
description = "The dialogue-maker script model, checks and stats"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
dm-syntax.workspace = true
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
globset = "0.4.20"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.0"
tempfile = "3.27.0"
toml = "1.1.8"
toml_edit = "0.25.17"
ts-rs = "12.0.1"
walkdir = "2.5.0"

[dev-dependencies]
expect-test = "1.5.1"
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
proptest = "1.12.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
toml_edit = "0.25.17"
